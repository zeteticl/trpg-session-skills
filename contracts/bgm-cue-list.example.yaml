# bgm-cue-list/v1

Session-night play order (Live Aid). Module-level suggestions live in `prep/11-bgm.md`.

```yaml
schema: bgm-cue-list/v1
session_id: "001"
cues:
  - id: cue-01
    when: session-start
    track: "Harbor Fog (curated)"
    note: Soft loop under briefing
  - id: cue-02
    when: enter-pier
    track: "Wood and Water"
    note: Switch when investigators reach the pier
  - id: cue-03
    when: mythos-hint
    track: silence
    note: Cut music on the wrong lantern reveal
```
